name: Deploy to Azure Container Apps

# Builds the image from this commit, pushes it to Azure Container Registry and rolls out a new
# Container Apps revision. GitHub stores no Azure password or key: the job trades its short-lived
# GitHub OIDC token for an Azure token (set up once by scripts/setup-github-oidc.sh), and the
# `azure-demo` environment can require a reviewer before anything touches Azure.
on:
  workflow_dispatch:

concurrency:
  group: deploy-aca
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: azure-demo
      url: ${{ steps.rollout.outputs.url }}
    permissions:
      id-token: write # lets azure/login exchange the GitHub OIDC token for an Azure token
      contents: read
      attestations: write # stores the signed build provenance of the image
    env:
      ACA_ACR_NAME: ${{ vars.ACA_ACR_NAME }}
      ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
      ACA_APP_NAME: ${{ vars.ACA_APP_NAME }}
    steps:
      - name: Check the environment variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACA_ACR_NAME ACA_RESOURCE_GROUP ACA_APP_NAME; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::azure-demo 환경에 변수가 없습니다: ${missing[*]}. 먼저 scripts/setup-github-oidc.sh --apply 를 실행하세요."
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare the image reference
        id: image
        run: |
          {
            echo "tag=${GITHUB_SHA::7}"
            echo "name=$ACA_ACR_NAME.azurecr.io/cloud-copilot-demo"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        run: az acr login --name "$ACA_ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: APP_VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Artifact attestations are free for public repositories; private ones need GitHub Enterprise Cloud.
      - name: Attest the build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}

      # The commit is the app version, so the UI shows exactly which commit answers a request.
      - name: Roll out a new revision
        id: rollout
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          TAG: ${{ steps.image.outputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          suffix="r${RUN_NUMBER}-${TAG}"
          az containerapp update --name "$ACA_APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --image "$IMAGE" --revision-suffix "$suffix" --set-env-vars "APP_VERSION=$TAG" \
            --only-show-errors --output none
          fqdn="$(az containerapp show --name "$ACA_APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          {
            echo "url=https://$fqdn"
            echo "revision=$ACA_APP_NAME--$suffix"
          } >> "$GITHUB_OUTPUT"

      # With scale-to-zero the first request starts a replica, so retry for a while.
      - name: Wait until the app answers
        env:
          URL: ${{ steps.rollout.outputs.url }}
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 "$URL/healthz"

      - name: Summarize
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          URL: ${{ steps.rollout.outputs.url }}
          REVISION: ${{ steps.rollout.outputs.revision }}
        run: |
          traffic="$(az containerapp ingress traffic show --name "$ACA_APP_NAME" --resource-group "$ACA_RESOURCE_GROUP" --output table)"
          {
            echo "### Azure Container Apps 배포 결과"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 앱 주소 | $URL |"
            echo "| 새 리비전 | $REVISION |"
            echo "| 이미지 | $IMAGE |"
            echo "| 커밋 | $GITHUB_SHA |"
            echo
            echo "트래픽 분포 (카나리 분할이 설정되어 있으면 새 리비전은 0% 로 만들어집니다):"
            echo
            printf '~~~\n%s\n~~~\n' "$traffic"
          } >> "$GITHUB_STEP_SUMMARY"
