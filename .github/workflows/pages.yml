name: Pages

# Publishes the recorded-demo slides at https://junwoojeong100.github.io/ghcp-in-the-cloud/.
# The PPTX files are assets of the `recorded-demo-slides` release, not files in git, so clones and
# copies made from this template stay small. To change a deck, replace the asset with
# `gh release upload recorded-demo-slides <file> --clobber` and run this workflow again.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A deployment that is already running is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SLIDES_RELEASE: recorded-demo-slides

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish slides
    # Copies made from this template have no release assets and no Pages site, so they skip it.
    if: github.repository == 'junwoojeong100/ghcp-in-the-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the page and the slides
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp docs/index.html _site/
          gh release download "$SLIDES_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.pptx' --dir _site
          ls -l _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
