name: Pages

# Publishes the recorded-demo slides and the English demo video at https://junwoojeong100.github.io/ghcp-in-the-cloud/.
# The PPTX files come from the repository; only the full MP4 is downloaded from the
# `recorded-demo-slides` release. Changes to either deck on main publish automatically.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - slides/GHCP_in_the_Cloud_Demo_KO.pptx
      - en/slides/GHCP_in_the_Cloud_Demo_EN.pptx
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A deployment that is already running is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SLIDES_RELEASE: recorded-demo-slides

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish slides
    # Copies made from this template do not own this Pages site, so they skip it.
    if: github.repository == 'junwoojeong100/ghcp-in-the-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the pages and the recorded-demo files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -R docs/. _site/
          cp slides/GHCP_in_the_Cloud_Demo_KO.pptx en/slides/GHCP_in_the_Cloud_Demo_EN.pptx _site/
          gh release download "$SLIDES_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir _site
          ls -lR _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
