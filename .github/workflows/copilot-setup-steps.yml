name: Copilot Setup Steps

# Prepares the environment of the GitHub Copilot cloud agent so it can run the same checks as
# CI (unit tests, Bicep, kubeconform, actionlint, shellcheck, hadolint) before it opens a pull
# request. The job must be called `copilot-setup-steps`, and this file must be on the default
# branch. The triggers below only validate the file when it changes.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/install-dev-tools.sh
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/install-dev-tools.sh

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install the app dependencies
        run: python -m pip install --requirement app/requirements.txt

      - name: Install kubeconform, actionlint and hadolint
        run: scripts/install-dev-tools.sh
