name: Demo CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s app/tests -v
      - name: Build container image
        run: docker build --file app/Dockerfile --tag cloud-copilot-demo:${{ github.sha }} .
