name: Copilot demo task
description: Copilot에게 맡길 작고 검증 가능한 작업을 정의합니다 (이슈에서 PR까지 데모용)
title: "[Demo] "
labels:
  - copilot-demo
body:
  - type: markdown
    attributes:
      value: |
        Copilot cloud agent는 이슈의 **제목과 본문**을 읽고 작업합니다. 할당한 뒤에 단 댓글은 읽지 못하므로, 필요한 내용은 모두 이 폼에 적어 주세요.

        작업은 PR 하나로 끝낼 수 있을 만큼 작고 검증 가능하게 정의합니다. 비밀(키, 토큰, 비밀번호)은 적지 마세요. 이슈를 만든 뒤 **Assignees**에서 **Copilot**을 선택하면 에이전트가 시작됩니다.
  - type: textarea
    id: context
    attributes:
      label: 배경 (Context)
      description: 왜 이 변경이 필요한가요? 지금 동작과 관련 파일을 알려 주세요.
      placeholder: |
        예) 데모 화면에서 이전 질문과 답변을 다시 보여 줄 수 없습니다. 화면은 app/index.html 에 있습니다.
    validations:
      required: true
  - type: textarea
    id: requirement
    attributes:
      label: 요구사항 (Requirement)
      description: 구현할 동작을 구체적으로 적어 주세요. 입력과 출력 예시, 환경 변수 이름, HTTP 상태 코드처럼 확인할 수 있는 값을 포함하면 좋습니다.
      placeholder: |
        예) 최근 질문과 답변 10개를 화면에 보여 주고, 지우기 버튼으로 목록을 비웁니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준 (Acceptance criteria)
      description: 관찰할 수 있는 동작과 테스트를 체크리스트로 적어 주세요. 에이전트는 이 목록을 완료 기준으로 삼습니다.
      placeholder: |
        - [ ] 질문을 12번 보내면 목록에는 최근 10개만 보입니다.
        - [ ] 지우기를 누르면 목록이 비워집니다.
        - [ ] 새 테스트가 추가되고 모든 테스트가 통과합니다.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 제약 사항 (Constraints)
      description: 수정해도 되는 파일과 영역, 반드시 지킬 규칙을 적어 주세요.
      value: |
        - 수정 범위: `app/` 와 관련 문서만
        - Python 3.12 표준 라이브러리만 사용합니다. 새 의존성을 추가하지 않습니다.
        - `/healthz` 는 인증 없이 동작하고, 그 외 경로는 기존 Basic 인증을 유지합니다.
        - 비밀, 키, 토큰을 코드, 로그, 예제에 넣지 않습니다.
    validations:
      required: true
  - type: textarea
    id: how_to_test
    attributes:
      label: 테스트 방법 (How to test)
      description: 에이전트와 리뷰어가 결과를 확인할 명령과 절차입니다.
      value: |
        - `python -m unittest discover -s app/tests -v`
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 범위 밖 (Out of scope)
      description: 이번 작업에서 하지 않을 일을 적어 두면 PR이 작게 유지됩니다.
      placeholder: |
        예) 서버 API 변경, 새 의존성 추가, 슬라이드 수정
    validations:
      required: false
