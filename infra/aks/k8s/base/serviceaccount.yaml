apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-copilot-demo
  labels:
    app.kubernetes.io/name: cloud-copilot-demo
    app.kubernetes.io/part-of: ghcp-in-the-cloud
  annotations:
    # Client ID of the user-assigned managed identity that infra/aks/main.bicep
    # federates with this ServiceAccount (Microsoft Entra Workload Identity).
    # The all-zero value is a placeholder replaced by scripts/render-aks-manifests.sh.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
