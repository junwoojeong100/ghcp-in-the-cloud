apiVersion: v1
kind: Service
metadata:
  name: cloud-copilot-demo
  labels:
    app.kubernetes.io/name: cloud-copilot-demo
    app.kubernetes.io/part-of: ghcp-in-the-cloud
spec:
  # ClusterIP on purpose: the demo is reached with `kubectl port-forward`,
  # so nothing is exposed to the internet.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloud-copilot-demo
  ports:
    - name: http
      port: 80
      targetPort: http
