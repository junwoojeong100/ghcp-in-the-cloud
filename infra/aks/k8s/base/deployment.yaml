apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-copilot-demo
  labels:
    app.kubernetes.io/name: cloud-copilot-demo
    app.kubernetes.io/part-of: ghcp-in-the-cloud
spec:
  # No `replicas`: the HorizontalPodAutoscaler owns the replica count.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-copilot-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-copilot-demo
        app.kubernetes.io/part-of: ghcp-in-the-cloud
        # Makes the Workload Identity webhook inject the federated token and AZURE_* variables.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cloud-copilot-demo
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Registry and tag are set by scripts/render-aks-manifests.sh.
          image: cloud-copilot-demo
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloud-copilot-demo-config
          env:
            - name: APP_PLATFORM
              value: aks
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_REVISION
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['pod-template-hash']"
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud-copilot-demo
                  key: password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
