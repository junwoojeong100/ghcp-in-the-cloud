apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the demo needs except the Namespace and the `cloud-copilot-demo` Secret
# (password), which scripts/deploy-aks.sh creates first so no secret lives in git.
# Environment-specific values (image, identity, backend) are layered on top by
# scripts/render-aks-manifests.sh.
namespace: cloud-copilot-demo

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - load-generator.yaml

# The generated name carries a content hash, so changing a value rolls the pods.
# The app version is not set here: it is baked into the image (--build-arg APP_VERSION),
# so `kubectl set image` or a new IMAGE_TAG is all a rollout needs.
configMapGenerator:
  - name: cloud-copilot-demo-config
    literals:
      - LLM_BACKEND=mock
      - FOUNDRY_MODEL=claude-sonnet-5-5
      - FOUNDRY_EFFORT=max
